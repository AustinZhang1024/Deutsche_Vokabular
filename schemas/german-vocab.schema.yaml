{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "German Vocabulary YAML Schema",
  "description": "Strict JSON Schema (Draft 2020-12) for German vocabulary and Redemittel YAML files.",
  "type": "object",
  "required": ["meta"],
  "properties":
    {
      "meta":
        {
          "type": "object",
          "required": ["category"],
          "additionalProperties": false,
          "properties":
            {
              "source":
                {
                  "type": "string",
                  "minLength": 1,
                  "description": "Source reference, e.g., 'Seite 31'",
                },
              "category":
                {
                  "type": "string",
                  "minLength": 1,
                  "description": "Category name determining whether 'words' or 'phrases' is required",
                },
              "topic":
                {
                  "type": "string",
                  "minLength": 1,
                  "description": "Topic of the vocabulary items",
                },
            },
        },
      "words": { "type": "array", "minItems": 1 },
      "phrases": { "type": "array", "minItems": 1 },
    },
  "allOf":
    [
      {
        "if":
          {
            "properties":
              {
                "meta": { "properties": { "category": { "const": "Nomen" } } },
              },
          },
        "then":
          {
            "required": ["meta", "words"],
            "not": { "required": ["phrases"] },
            "additionalProperties": false,
            "properties":
              {
                "meta": true,
                "words":
                  {
                    "type": "array",
                    "minItems": 1,
                    "items":
                      {
                        "type": "object",
                        "required": ["word", "en"],
                        "additionalProperties": false,
                        "properties":
                          {
                            "word":
                              {
                                "type": "string",
                                "pattern": "^(der|die|das)\\s+[A-ZÄÖÜ][a-zA-Zäöüß-]+,\\s*(-|-[a-zäöüß\\[\\]]+)$",
                              },
                            "en": { "type": "string", "minLength": 1 },
                          },
                      },
                  },
              },
          },
      },
      {
        "if":
          {
            "properties":
              {
                "meta": { "properties": { "category": { "const": "Verben" } } },
              },
          },
        "then":
          {
            "required": ["meta", "words"],
            "not": { "required": ["phrases"] },
            "additionalProperties": false,
            "properties":
              {
                "meta": true,
                "words":
                  {
                    "type": "array",
                    "minItems": 1,
                    "items":
                      {
                        "type": "object",
                        "required":
                          [
                            "word",
                            "separable",
                            "third_person",
                            "en",
                            "mastered",
                          ],
                        "additionalProperties": false,
                        "properties":
                          {
                            "word":
                              { "type": "string", "pattern": "^[a-zäöüß]+$" },
                            "separable": { "type": "boolean" },
                            "third_person":
                              { "type": "string", "pattern": "^er/sie\\s+.+$" },
                            "en": { "type": "string", "minLength": 1 },
                            "mastered": { "type": "boolean" },
                          },
                      },
                  },
              },
          },
      },
      {
        "if":
          {
            "properties":
              {
                "meta":
                  {
                    "properties":
                      { "category": { "const": "Adjektive/Adverbien" } },
                  },
              },
          },
        "then":
          {
            "required": ["meta", "words"],
            "not": { "required": ["phrases"] },
            "additionalProperties": false,
            "properties":
              {
                "meta": true,
                "words":
                  {
                    "type": "array",
                    "minItems": 1,
                    "items":
                      {
                        "type": "object",
                        "required": ["word", "mastered"],
                        "additionalProperties": false,
                        "properties":
                          {
                            "word": { "type": "string", "minLength": 1 },
                            "en": { "type": "string", "minLength": 1 },
                            "mastered": { "type": "boolean" },
                          },
                      },
                  },
              },
          },
      },
      {
        "if":
          {
            "properties":
              {
                "meta":
                  {
                    "properties":
                      {
                        "category":
                          {
                            "not":
                              {
                                "enum":
                                  ["Nomen", "Verben", "Adjektive/Adverbien"],
                              },
                          },
                      },
                  },
              },
          },
        "then":
          {
            "required": ["meta", "phrases"],
            "not": { "required": ["words"] },
            "additionalProperties": false,
            "properties":
              {
                "meta": true,
                "phrases":
                  {
                    "type": "array",
                    "minItems": 1,
                    "items":
                      {
                        "type": "object",
                        "required": ["de", "mastered"],
                        "additionalProperties": false,
                        "properties":
                          {
                            "de": { "type": "string", "minLength": 1 },
                            "en": { "type": "string", "minLength": 1 },
                            "mastered": { "type": "boolean" },
                          },
                      },
                  },
              },
          },
      },
    ],
}
