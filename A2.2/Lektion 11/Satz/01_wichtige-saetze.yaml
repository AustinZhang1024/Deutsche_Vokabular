meta:
  source: "Lektion 11 - Wichtige Sätze"
  category: "Wichtige Sätze"
  topic: "Eine Person beschreiben & Freundschaftsgeschichte erzählen"
phrases:
  - de: "eine Person beschreiben"
    en: "to describe a person"
    mastered: false
  - de: "Er/Sie hat rote/blonde/braune/schwarze Haare."
    mastered: false
  - de: "Er/Sie hat kurze/lange schwarze Locken."
    en: "He/She has short/long black curls."
    mastered: false
  - de: "Ich meine den Mann mit der Brille."
    en: "I mean the man with the glasses."
    mastered: false
  - de: "Er/Sie ist (sehr) kreativ."
    mastered: false
  - de: "Er/Sie hat blaue/grüne/braune Augen."
    mastered: false
  - de: "Er trägt/hat ein weißes Hemd / einen Bart."
    en: "He is wearing/has a white shirt / a beard."
    mastered: false
  - de: "eine Freundschaftsgeschichte erzählen"
    en: "to tell a friendship story"
    mastered: false
  - de: "Sie haben sich (in der Schule) kennengelernt."
    en: "They met (at school)."
    mastered: false
  - de: "Luisa kennt Vincent seit ihrer Kindheit/Jugend."
    en: "Luisa has known Vincent since her childhood/youth."
    mastered: false
  - de: "Sie sind gute Freunde geworden."
    en: "They became good friends."
    mastered: false
  - de: "Sie haben immer zusammen gespielt/gelacht."
    mastered: false
  - de: "Mit Bianca konnte sie über alles sprechen."
    en: "With Bianca, she could talk about everything."
    mastered: false
  - de: "Sie waren oft unterwegs / auf Reisen / im Park."
    en: "They were often out and about / traveling / in the park."
    mastered: false
  - de: "Dann ist sie umgezogen / hat er geheiratet."
    en: "Then she moved away / he got married."
    mastered: false
  - de: "Danach hatten sie weniger Kontakt."
    en: "After that, they had less contact."
    mastered: false
  - de: "Wenn sie sich sehen, ist alles wie früher."
    en: "When they see each other, everything is like it used to be."
    mastered: false
  - de: "Heute haben sie nur noch wenig Kontakt."
    en: "Today they only have little contact left."
    mastered: false
