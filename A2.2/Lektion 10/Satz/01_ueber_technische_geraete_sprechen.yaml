  - de: Als Karrierecoach schreibe ich oft E-Mails und bereite Webinare vor – auch unterwegs.
    en: As a career coach, I often write emails and prepare webinars – even on the go.
    mastered: false
  - de: Ohne meinen Laptop kann ich nicht arbeiten.
    mastered: false
  - de: Ich brauche mein Smartphone ständig.
    en: I need my smartphone constantly.
    mastered: false
  - de: Am häufigsten chatte ich mit der Familie.
    en: Most often, I chat with my family.
